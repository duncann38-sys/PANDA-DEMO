name: Deploy Panda Consumer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out Panda Consumer
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          set -eu
          test -n "$GOOGLE_MAPS_BROWSER_KEY"
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          key = os.environ["GOOGLE_MAPS_BROWSER_KEY"].strip()
          injection = (
              "<script>window.__PANDA_GOOGLE_MAPS_BROWSER_KEY__="
              + json.dumps(key)
              + ";</script>"
          )
          marker = "window.__PANDA_GOOGLE_MAPS_BROWSER_KEY__="
          if marker not in html:
              html = html.replace("<head>", "<head>" + injection, 1)
          path.write_text(html, encoding="utf-8")
          PY
          grep -q 'window.__PANDA_GOOGLE_MAPS_BROWSER_KEY__' _site/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
