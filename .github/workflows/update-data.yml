name: Update Venue Data for our Launch
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install apify-client
      - name: Run data fetch script
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/fetch-data.js
      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: automatic daily update of venue data for our Launch" && git push)
