
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8FC79E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Panda" />
<title>Panda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#8FC79E;--green-btn:#83C193;--green-deep:#2E7D50;--green-soft:#A6D8AE;--green-tint:#EAF6EC;
  --peach:#F7DFC5;--peach-2:#E4883A;
  --ink:#2C2C2E;--ink-2:#4A4A4E;--muted:#8A8A8E;--muted-2:#B4B4B8;
  --line:#EDEDED;--line-2:#F4F4F4;--card:#FFFFFF;--bg:#FFFFFF;
  --heart:#F0554E;--star:#F5B301;--pin:#E4553B;
  --sh-sm:0 1px 2px rgba(30,30,30,.05),0 2px 10px rgba(30,30,30,.05);
  --sh-md:0 6px 20px rgba(30,30,30,.08),0 2px 6px rgba(30,30,30,.05);
  --sh-lg:0 20px 50px rgba(20,40,25,.22);
  --ff:'Poppins',system-ui,-apple-system,sans-serif;--ff-round:'Fredoka','Poppins',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ff);background:#e7e9ea;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}

.device{position:relative;width:100%;max-width:420px;height:100dvh;background:var(--bg);overflow:hidden;box-shadow:var(--sh-lg);display:flex;flex-direction:column}
@media(min-width:520px){.device{border-radius:44px;border:10px solid #101012;height:880px;max-height:900px}body{padding:20px}}
@media(max-width:519px){body{padding:0;background:var(--bg)}.device{max-width:none;border:0;border-radius:0;box-shadow:none}}

/* status bar */
.statusbar{height:auto;min-height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(13px + env(safe-area-inset-top)) 22px 0;font-size:14px;font-weight:600;color:var(--ink);z-index:40;position:relative}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}
.sig i{width:3px;background:var(--ink);border-radius:1px;display:block}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px}
.batt{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative;padding:1.5px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 1px 1px 0}
.batt i{display:block;height:100%;width:82%;background:var(--green-deep);border-radius:1px}

.viewport{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(92px + env(safe-area-inset-bottom));opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .26s ease,transform .26s cubic-bezier(.22,.61,.36,1)}
.screen.active{opacity:1;transform:none;pointer-events:auto;z-index:2}
.screen::-webkit-scrollbar{display:none}

/* ---------- HOME ---------- */
.searchbar{margin:6px 20px 4px;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh-sm)}
.searchbar svg{width:19px;height:19px;stroke:var(--muted);flex:0 0 auto}
.searchbar input{border:none;outline:none;font-size:15px;flex:1;background:none;color:var(--ink)}
.searchbar input::placeholder{color:var(--muted-2)}

.sec-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.sec-h h2{font-family:var(--ff);font-size:17px;font-weight:600;margin:0}
.sec-h .filt{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--sh-sm)}
.sec-h .filt svg{width:17px;height:17px;stroke:var(--ink)}
.sec-h .cnt{font-size:12.5px;color:var(--muted);font-weight:500}

.cats{display:flex;gap:12px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.catcard{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);transition:transform .12s}
.catcard:active{transform:scale(.95)}
.catcard .e{font-size:30px;line-height:1}
.catcard .l{font-size:11.5px;font-weight:500;color:var(--ink-2)}
.catcard.on{background:var(--peach);border-color:var(--peach)}
.catcard.on .l{color:var(--peach-2);font-weight:600}

/* restaurant list card */
.rlist{display:flex;flex-direction:column;gap:14px;padding:2px 20px 8px}
.rcard{display:flex;gap:13px;background:#F3F9F3;border:1px solid #E4F0E5;border-radius:18px;padding:11px;box-shadow:var(--sh-sm);position:relative;transition:transform .12s,background .16s,box-shadow .16s,border-color .16s}
.rcard:hover{background:#E9F6EC;box-shadow:var(--sh-md);border-color:#CFE9D5}
.rcard:active{transform:scale(.985)}
.rcard.feature{background:linear-gradient(120deg,#D6F0DB,#ECF8EE);border-color:#BFE6C7}
.rcard.fav{background:var(--green-tint);border-color:#CDE9D3}
.seg{display:flex;gap:8px;flex-wrap:wrap;padding:0}
.seg button{flex:1;min-width:64px;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;transition:.12s;line-height:1.2}
.seg button.on{background:var(--green-tint);border-color:var(--green);color:var(--green-deep);font-weight:600}
.chk{display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:500;margin:0}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted-2);display:grid;place-items:center;flex:0 0 auto;transition:.12s}
.chk.on{border-color:var(--green);background:var(--green-tint)}
.chk.on .box{background:var(--green-btn);border-color:var(--green-btn)}
.chk .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3;opacity:0;transition:.12s}
.chk.on .box svg{opacity:1}
.rcard .thumb{width:82px;height:82px;border-radius:14px;flex:0 0 82px;background:var(--line-2);background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden}
.rcard .thumb .e{font-size:34px}
.rcard .info{flex:1;min-width:0;padding-top:2px}
.rcard .nm{font-weight:600;font-size:15.5px;padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .adr{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
.rcard .adr svg{width:11px;height:11px;stroke:var(--muted);flex:0 0 auto}
.rcard .adr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .meta{font-size:12.5px;color:var(--ink-2);margin-top:7px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rcard .dot{color:var(--muted-2)}
.rcard .price{color:var(--green-deep);font-weight:600}
.rcard .heart{position:absolute;top:12px;right:12px;width:26px;height:26px;display:grid;place-items:center}
.rcard .heart svg{width:20px;height:20px;stroke:var(--muted-2);fill:none;stroke-width:1.8;transition:.15s}
.rcard .heart.on svg{stroke:var(--heart);fill:var(--heart)}
.openflag{font-size:11px;font-weight:600;padding:2px 0;color:var(--green-deep)}
.openflag.shut{color:var(--muted)}

.homefoot{text-align:center;font-size:11px;color:var(--muted-2);padding:16px 20px 8px;line-height:1.5}

/* credit strip on home */
.creditstrip{margin:14px 20px 4px;border-radius:20px;padding:18px 18px;background:linear-gradient(120deg,#2E7D50,#3f9c66);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-md)}
.creditstrip::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.creditstrip .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:600}
.creditstrip .amt{font-family:var(--ff-round);font-size:26px;font-weight:700;margin:3px 0 2px}
.creditstrip .ld{font-size:12.5px;opacity:.9;max-width:78%;line-height:1.45}
.creditstrip .go{margin-top:13px;background:#fff;color:var(--green-deep);font-weight:600;font-size:13px;padding:10px 16px;border-radius:100px;display:inline-flex;align-items:center;gap:7px}
.creditstrip .go svg{width:15px;height:15px;stroke:var(--green-deep)}

/* ---------- MAP ---------- */
.mapscreen{padding-bottom:0}
.maphead{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(6px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(180deg,#fff 62%,rgba(255,255,255,0))}
.maphead .row{display:flex;align-items:center;gap:8px;padding:6px 4px 10px}
.maphead .back{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:grid;place-items:center}
.maphead .back svg{width:18px;height:18px;stroke:var(--ink)}
.maphead .ttl{font-weight:600;font-size:16px}
.msearch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px 14px;box-shadow:var(--sh-sm);margin:0 4px}
.msearch svg{width:17px;height:17px;stroke:var(--muted)}
.msearch input{border:none;outline:none;font-size:14px;flex:1;background:none}
.mfilters{display:flex;gap:9px;padding:11px 4px 2px;overflow-x:auto;scrollbar-width:none}
.mfilters::-webkit-scrollbar{display:none}
.fpill{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:100px;padding:8px 13px;font-size:13px;font-weight:500;box-shadow:var(--sh-sm)}
.fpill.on{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.fpill svg{width:13px;height:13px;stroke:currentColor}
.mapcanvas{position:absolute;inset:0;background:#e9ede8}
.searcharea{position:absolute;left:50%;transform:translateX(-50%);z-index:7;background:var(--green-btn);color:#fff;font-weight:600;font-size:13px;padding:10px 18px;border-radius:100px;box-shadow:var(--sh-md);display:flex;align-items:center;gap:7px;top:calc(150px + env(safe-area-inset-top))}
.searcharea svg{width:15px;height:15px;stroke:#fff}
.mapstatus{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(186px + env(safe-area-inset-bottom));z-index:7;background:#fff;border:1px solid var(--line);border-radius:100px;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--sh-md);display:flex;align-items:center;gap:8px}
.mapstatus .d{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
.mapstatus.live .d{background:var(--green);animation:pulse 1.8s infinite}
.mapstatus b{color:var(--green-deep)}
.mapcard{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:7;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh-md);display:flex;gap:12px;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.mapcard.show{transform:none;opacity:1;pointer-events:auto}
.mapcard .thumb{width:64px;height:64px;border-radius:12px;flex:0 0 64px;background:var(--line-2);background-size:cover;background-position:center;display:grid;place-items:center;font-size:26px}
.mapcard .info{flex:1;min-width:0}
.mapcard .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapcard .adr{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapcard .meta{font-size:12px;color:var(--ink-2);margin-top:5px;font-weight:500}
/* demo map */
.mydot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mydot .core{width:16px;height:16px;border-radius:50%;background:#2b7fff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mydot .ring{position:absolute;inset:-14px;border-radius:50%;background:rgba(43,127,255,.18);animation:radar 2.2s infinite ease-out}
@keyframes radar{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.dpin{position:absolute;transform:translate(-50%,-100%);z-index:1;cursor:pointer}
.dpin svg{width:30px;height:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}

/* ---------- TAB BAR ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom));z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:10px 6px calc(18px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted-2);font-size:10.5px;font-weight:500;transition:.15s}
.tab svg{width:24px;height:24px;stroke:var(--muted-2);fill:none;stroke-width:1.9;transition:.15s}
.tab.on{color:var(--green-deep)}
.tab.on svg{stroke:var(--green-deep)}
.tab:active{transform:scale(.9)}

/* ---------- SHEET (grid / options) ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,20,20,.45);opacity:0;pointer-events:none;transition:.3s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:26px 26px 0 0;max-height:88%;overflow-y:auto;scrollbar-width:none;transform:translateY(101%);transition:transform .32s cubic-bezier(.22,.61,.36,1);box-shadow:var(--sh-lg);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet::-webkit-scrollbar{display:none}
.grabber{width:38px;height:5px;border-radius:100px;background:var(--line);margin:12px auto 6px}
.sheet-title{font-weight:600;font-size:16px;text-align:center;padding:4px 20px 6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 8px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:16px;background:#fff;border:1px solid var(--line);transition:.12s}
.gcell .e{font-size:30px}
.gcell .l{font-size:11.5px;font-weight:500;color:var(--ink-2);text-align:center}
.gcell.on{background:var(--peach);border-color:var(--peach)}
.gcell.on .l{color:var(--peach-2);font-weight:600}
.opts{padding:12px 20px 4px;display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:500;text-align:center;transition:.12s}
.opt.on{border-color:var(--green-deep);background:var(--green-tint);color:var(--green-deep);font-weight:600}
.sheet-cta{padding:14px 18px calc(6px + env(safe-area-inset-bottom))}

/* ---------- DETAIL (restaurant page) ---------- */
.detail{position:absolute;inset:0;z-index:70;background:#fff;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,.61,.36,1);overflow-y:auto;scrollbar-width:none}
.detail.show{transform:none}
.detail::-webkit-scrollbar{display:none}
.dhero{position:relative;height:270px;background:#dfe3df;overflow:hidden}
.dhero .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.dhero .track::-webkit-scrollbar{display:none}
.dhero .slide{flex:0 0 100%;height:100%;scroll-snap-align:start;background-size:cover;background-position:center;display:grid;place-items:center}
.dhero .slide .e{font-size:80px}
.dhero .scrim-b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.dhero .topbtns{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.dhero .cbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:var(--sh-sm)}
.dhero .cbtn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2}
.dhero .rgt{display:flex;gap:9px}
.dhero .cbtn.fav.on svg{stroke:var(--heart);fill:var(--heart)}
.dhero .name{position:absolute;left:20px;bottom:34px;color:#fff;font-family:var(--ff-round);font-weight:700;font-size:27px;z-index:3;text-shadow:0 2px 12px rgba(0,0,0,.4);padding-right:20px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:.2s}
.dots i.on{background:#fff;width:16px;border-radius:100px}

.dbody{padding:20px 20px 40px}
.dabout{display:flex;align-items:center;justify-content:space-between}
.dabout h3{font-size:19px;font-weight:600;margin:0}
.ostatus{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green-deep)}
.ostatus.shut{color:var(--muted)}
.ostatus svg{width:15px;height:15px;stroke:currentColor}
.dbio{font-size:14px;line-height:1.6;color:var(--ink-2);margin:12px 0 14px}
.dlink{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500;text-decoration:none;margin-bottom:14px}
.dlink svg{width:17px;height:17px}
.dminimap{height:150px;border-radius:16px;overflow:hidden;background:var(--line-2);margin:4px 0 16px;position:relative}
.dminimap .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.dmeta{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.dmeta .price{color:var(--green-deep);font-weight:600}
.drating{display:flex;align-items:center;gap:10px;margin:4px 0 20px}
.drating .num{font-weight:600;font-size:15px}
.starrow{display:flex;gap:2px}
.starrow svg{width:16px;height:16px}
.drating a{margin-left:auto;font-size:13px;color:var(--green-deep);font-weight:500;text-decoration:none}
.dbtns{display:flex;gap:12px}
.dbtn{flex:1;padding:15px;border-radius:100px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.dbtn:active{transform:scale(.97)}
.dbtn.ghost{background:#fff;border:1.5px solid var(--green-btn);color:var(--green-deep)}
.dbtn.fill{background:var(--green-btn);color:#fff}
.dbtn svg{width:17px;height:17px}
.dhours{margin:6px 0 4px}
.dhours .hr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.dhours .hr.today{font-weight:600}
.dhours .hr .t{color:var(--muted)}
.dhours .hr.today .t{color:var(--green-deep)}
.dsec-t{font-size:15px;font-weight:600;margin:20px 0 8px}
.review{background:var(--line-2);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.review .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.review .av{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.review .rn{font-size:13px;font-weight:600}
.review .rs{margin-left:auto;display:flex;gap:1px}
.review .rs svg{width:12px;height:12px}
.review .rt{font-size:13px;line-height:1.5;color:var(--ink-2)}

/* ---------- CREDIT / FORMS ---------- */
.pagehead .back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.pagehead .back svg{width:18px;height:18px;stroke:var(--ink)}
.pagehead h1{font-size:20px;font-weight:600;margin:0}
.flow-eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep);padding:16px 20px 0}
.flow-title{font-family:var(--ff-round);font-size:25px;font-weight:700;margin:6px 20px 6px;line-height:1.15}
.flow-desc{color:var(--muted);font-size:14px;line-height:1.55;margin:0 20px}
.progress{display:flex;gap:6px;padding:16px 20px 0}
.progress i{height:4px;flex:1;border-radius:100px;background:var(--line)}

.rangewrap{padding:8px 20px 4px}

.schedule{margin:16px 20px 0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-2)}

.st{font-weight:500;font-size:14px}.ss{font-size:12px;color:var(--muted)}
.sa{font-weight:600}
.btn{width:calc(100% - 40px);margin:20px;padding:16px;border-radius:16px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s}

.processing h3{font-size:19px;font-weight:600;margin:24px 0 6px}
.processing p{color:var(--muted);font-size:14px;margin:0}

.tick svg{width:42px;height:42px;stroke:#fff;stroke-width:3.5;fill:none}

.approved h2{font-family:var(--ff-round);font-size:25px;margin:0 0 6px}

</head>

<script>
/* ==================== CONFIG ====================
   Google Maps API key. Needs Maps JavaScript API + Places API (New)
   enabled and billing on. Restrict by HTTP referrer before publishing. */
const GOOGLE_API_KEY = "AIzaSyBqexm9W6oHI-2usVOrMalyyAt74EnLpbo";

/* ===== Waitlist capture → your Google Form =====
   Data is posted straight into "Join the Panda Waitlist".
   Paste your form's field IDs below (one-time setup):
   1. Open the form → ⋮ menu → "Get pre-filled link".
   2. Fill each question with a dummy value, then "Get link" → Copy.
   3. In that link each answer looks like  entry.123456789=Yes
   4. Copy each entry.NUMBER into the matching line below.
   Until filled, submissions are still captured in-app; once filled,
   they also land in your Google responses sheet. */
const FORM = {
  action:"https://docs.google.com/forms/d/e/1FAIpQLSdcxPUi1Va-5AYS9eEZySIjJoUSXHFLGCcmTCpWqC7N8ctMlg/formResponse",
  entry:{ email:"", age:"", student:"", frequency:"", spend:"", interested:"", followed:"" }
};
function submitToForm(d){
  try{
    if(!FORM.entry.email) return; // not configured yet
    const f=document.createElement('form');
    f.action=FORM.action;f.method='POST';f.target='pandaFormFrame';f.style.display='none';
    const add=(k,v)=>{if(!k)return;const i=document.createElement('input');i.type='hidden';i.name=k;i.value=(v==null?'':v);f.appendChild(i);};
    add(FORM.entry.email,d.email);add(FORM.entry.age,d.age);add(FORM.entry.student,d.student);
    add(FORM.entry.frequency,d.frequency);add(FORM.entry.spend,d.spend);add(FORM.entry.interested,d.interested);
    add(FORM.entry.followed,d.followed?'Followed':'');
    document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500);
  }catch(e){console.warn('form submit',e);}
}
function mcLogo(){return `<svg width="42" height="26" viewBox="0 0 48 30" xmlns="http://www.w3.org/2000/svg"><circle cx="18" cy="15" r="12" fill="#EB001B"/><circle cx="30" cy="15" r="12" fill="#F79E1B"/><path d="M24 6.2a12 12 0 0 1 0 17.6 12 12 0 0 1 0-17.6Z" fill="#FF5F00"/></svg>`;}

const FIELDS=['id','displayName','location','rating','userRatingCount','priceLevel','types','primaryType','primaryTypeDisplayName','photos','editorialSummary','regularOpeningHours','formattedAddress','nationalPhoneNumber','internationalPhoneNumber','websiteURI','businessStatus','reviews','reservable'];

const USER={lat:51.5136,lng:-0.1365};
const CATEGORIES=[
  {label:'Indian',e:'🍛',m:['indian']},
  {label:'Italian',e:'🍝',m:['italian','trattoria','pasta']},

function txt(x){return x==null?'':(typeof x==='string'?x:(x.text||''))}
function safeLS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);return v;}catch(e){return null;}}
function hav(a,b){const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
function distM(v){return hav(USER,v);}
function distLabel(v){const m=distM(v);return m<1000?(Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';}
function money(n){return '£'+n.toLocaleString();}
function todayIdx(){return (new Date().getDay()+6)%7;}
function to12(t){let hh=Math.floor(t%24),mm=Math.round((t%1)*60);let ap=hh<12?'am':'pm';let h12=(hh%12)||12;return `${h12}${mm?':'+String(mm).padStart(2,'0'):''}${ap}`;}

function openInfo(v){
  if(!v.hours)return {unknown:true,open:false,closeStr:''};
  const now=new Date();let day=(now.getDay()+6)%7;const h=now.getHours()+now.getMinutes()/60;
  const chk=(d,t)=>{const s=v.hours[d];if(!s)return false;let[o,c]=s;if(c<=o)return t>=o||t<c;return t>=o&&t<c;};
  let open=chk(day,h);if(!open){const y=(day+6)%7,ys=v.hours[y];if(ys&&ys[1]<=ys[0]&&h<ys[1])open=true;}
  let closeStr='';if(open){const s=v.hours[day]||v.hours[(day+6)%7];closeStr=to12(s[1]);}
  return {open,closeStr,unknown:false};
}

function spendForTwo(price){const m={'£':'£20–30','££':'£45–70','£££':'£80–130','££££':'£150+'};return m[price||'££']||'£45–70';}
const DISH_WORDS=['pasta','pizza','risotto','steak','burger','ramen','sushi','sashimi','taco','curry','dumpling','oyster','brunch','coffee','espresso','pastry','croissant','dessert','tiramisu','cheesecake','fries','wings','roast','cocktail','negroni','margarita','martini','wine','tapas','paella','kebab','falafel','mezze','pad thai','noodle','bao','dim sum','fried chicken','ribs','brisket','lobster','scallop','tuna','burrata','gnocchi','chocolate','matcha'];
function mentions(v){if(!v.reviews_list||!v.reviews_list.length)return [];const blob=v.reviews_list.map(r=>(r.text||'').toLowerCase()).join('  ');const c={};DISH_WORDS.forEach(w=>{const re=new RegExp('\\b'+w.replace(/ /g,'\\s')+'s?\\b','g');const mm=blob.match(re);if(mm)c[w]=mm.length;});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]);}
function bestFor(v){const s=(v.searchStr||v.cuisine||'').toLowerCase();if(/cafe|coffee|bakery|brunch/.test(s))return 'work & casual catch-ups';if(/bar|pub|cocktail|night|club/.test(s))return 'drinks & nights out';if(/spa|wellness/.test(s))return 'treating yourself';if((v.price||'').length>=3&&(v.rating||0)>=4.5)return 'special occasions';return 'casual dining with friends';}
function goodToKnow(v){

  const rows=[];
  if(hasPrice)rows.push(`<div class="gk-row"><span class="ic">💷</span><div><b>${spendForTwo(v.price)}</b> for two <span style="color:var(--muted)">· estimate</span></div></div>`);

function loadGoogle(key){return new Promise((res,rej)=>{if(window.google&&window.google.maps){res();return;}window.__pgReady=()=>res();const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&v=weekly&loading=async&callback=__pgReady`;s.async=true;s.onerror=()=>rej(new Error('Google Maps failed to load'));document.head.appendChild(s);});}
function getLocation(){return new Promise(res=>{if(!navigator.geolocation){locStatus='unsupported';res(false);return;}navigator.geolocation.getCurrentPosition(p=>{USER.lat=p.coords.latitude;USER.lng=p.coords.longitude;searchCenter={lat:USER.lat,lng:USER.lng};locStatus='ok';res(true);},e=>{locStatus=(e&&e.code===1)?'denied':'error';res(false);},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});});}
function priceLbl(p){const m={FREE:'£',INEXPENSIVE:'£',MODERATE:'££',EXPENSIVE:'£££',VERY_EXPENSIVE:'££££',0:'£',1:'£',2:'££',3:'£££',4:'££££'};return (p!=null&&m[p])||'££';}
function ghours(roh){if(!roh||!roh.periods)return null;const w=[null,null,null,null,null,null,null];roh.periods.forEach(p=>{if(!p.open||p.open.day==null)return;const md=(p.open.day+6)%7;const o=p.open.hour+(p.open.minute||0)/60;let c=p.close?(p.close.hour+(p.close.minute||0)/60):24;w[md]=[o,c];});return w.some(x=>x)?w:null;}
function shortArea(a){if(!a)return '';const p=a.split(',').map(s=>s.trim()).filter(Boolean);return p.length>=3?p[p.length-3]:(p[0]||'');}
function mapPlace(p){
  const loc=p.location;const lat=typeof loc.lat==='function'?loc.lat():loc.lat;const lng=typeof loc.lng==='function'?loc.lng():loc.lng;
  let photos=[];try{if(p.photos)photos=p.photos.slice(0,5).map(ph=>ph.getURI({maxWidthPx:900}));}catch(e){}
  const reviews_list=(p.reviews||[]).map(r=>({author:txt(r.authorAttribution&&r.authorAttribution.displayName)||'Google user',rating:r.rating,text:txt(r.text)}));
  const cuisine=txt(p.primaryTypeDisplayName)||'Restaurant';
  const blurb=txt(p.editorialSummary)||(reviews_list[0]?reviews_list[0].text.slice(0,200):'');
  return {id:p.id,gid:p.id,name:txt(p.displayName)||'Venue',lat,lng,rating:p.rating?Math.round(p.rating*10)/10:null,reviews:p.userRatingCount||0,
    price:priceLbl(p.priceLevel),cuisine,searchStr:(cuisine+' '+((p.types||[]).join(' '))).toLowerCase(),
    hours:ghours(p.regularOpeningHours),weekdayText:(p.regularOpeningHours&&p.regularOpeningHours.weekdayDescriptions)||null,
    photo:photos[0]||null,photos,blurb,reviews_list,address:p.formattedAddress||'',area:shortArea(p.formattedAddress),
    phone:p.nationalPhoneNumber||p.internationalPhoneNumber||'',website:p.websiteURI||'',reservable:!!p.reservable};
}
async function fetchPlaces(center){
  center=center||searchCenter||USER;
  const {Place,SearchNearbyRankPreference}=await google.maps.importLibrary('places');
  const groups=[['restaurant'],['bar'],['cafe'],['bakery'],['meal_takeaway'],['night_club'],['tourist_attraction'],['spa']];
  let all=[];const seen=new Set();
  const collect=(places)=>{(places||[]).forEach(p=>{if(p.businessStatus&&p.businessStatus!=='OPERATIONAL')return;const t=p.types||[];if(t.some(x=>['lodging','hotel','motel','resort_hotel','guest_house','hostel','bed_and_breakfast','apartment_complex','extended_stay_hotel','campground'].includes(x)))return;if(!seen.has(p.id)){seen.add(p.id);all.push(mapPlace(p));}});};
  for(const types of groups){
    const base={locationRestriction:{center,radius:2500},includedTypes:types,maxResultCount:20,rankPreference:SearchNearbyRankPreference.DISTANCE,language:'en-GB',region:'gb'};
    try{const r=await Place.searchNearby({...base,fields:FIELDS});collect(r.places);}
    catch(e){try{const r=await Place.searchNearby({...base,fields:CORE_FIELDS});collect(r.places);}catch(e2){console.warn('nearby',types,(e2&&e2.message)||e2);}}
  }
  if(!all.length){
    const b={textQuery:'restaurants and bars near me',locationBias:{center,radius:2500},maxResultCount:20,language:'en-GB',region:'gb'};
    try{const r=await Place.searchByText({...b,fields:FIELDS});collect(r.places);}
    catch(e){try{const r=await Place.searchByText({...b,fields:CORE_FIELDS});collect(r.places);}catch(e2){console.warn('text',(e2&&e2.message)||e2);}}
  }
  all.sort((a,b)=>hav(center,a)-hav(center,b));return all.slice(0,60);
}

      <button class="btn dark" onclick="cSubmit()">Join the waitlist</button>

}
function creditNext(s){if(!state.creditData.amount)state.creditData.amount=300;state.creditStep=s;renderCredit();document.getElementById('s-credit').scrollTop=0;}
function cStep1(){const name=vval('f-name'),email=vval('f-email'),age=vval('f-age');if(!email){toast('Add your email to continue');return;}if(!age){toast('Add your age');return;}Object.assign(state.creditData,{name,email,age});state.creditStep=2;renderCredit();document.getElementById('s-credit').scrollTop=0;}

function toggleChk(f,el){state.creditData[f]=!state.creditData[f];el.classList.toggle('on',state.creditData[f]);}
function cSubmit(){
  const d=state.creditData;

function vval(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function schedule(amt){const per=Math.round(amt/3);const d0=new Date();const f=n=>{const d=new Date(d0);d.setDate(d.getDate()+n);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});};
  return `<div class="schedule"><div class="srow first"><div class="sleft"><div class="sdot">✓</div><div><div class="st">Spend today</div><div class="ss">Available instantly</div></div></div><div class="sa">${money(amt)}</div></div>
    <div class="srow"><div class="sleft"><div class="sdot">1</div><div><div class="st">First payment</div><div class="ss">In 30 days · ${f(30)}</div></div></div><div class="sa">${money(per)}</div></div>
    <div class="srow"><div class="sleft"><div class="sdot">2</div><div><div class="st">Second payment</div><div class="ss">In 60 days · ${f(60)}</div></div></div><div class="sa">${money(per)}</div></div>
    <div class="srow"><div class="sleft"><div class="sdot">3</div><div><div class="st">Final payment</div><div class="ss">In 90 days · ${f(90)}</div></div></div><div class="sa">${money(amt-per*2)}</div></div></div>`;}
function cProcessing(){const el=document.getElementById('creditContent');el.innerHTML=`<div class="processing"><div class="spinner"></div><h3>Adding you to the waitlist</h3><p id="pm">Saving your details…</p></div>`;const m=["Saving your details…","Checking eligibility…","Reserving your £300…","Almost there…"];let i=0;const iv=setInterval(()=>{i++;const p=document.getElementById('pm');if(p&&m[i])p.textContent=m[i];},600);setTimeout(()=>{clearInterval(iv);cThankYou();},2400);}
function cThankYou(){
  const d=state.creditData;const amt=d.amount||300;

  saveProfile();addPoints(50);const g=document.getElementById('gate');if(g)g.remove();sfx('win');

    <div class="vcard"><div class="top"><div class="pnd">Panda</div><div class="chip"></div></div><div class="num">${num}</div><div class="bot"><div><div class="lb">Card holder</div><div class="vl">${d.name||'Panda member'}</div></div><div style="text-align:right"><div class="lb">Coming soon</div><div class="vl">${money(amt)}</div></div></div><div class="mc">${mcLogo()}</div></div>
    ${schedule(amt)}
    <button class="btn fill" onclick="go('home')">Back to home</button>

  if('vibrate' in navigator)navigator.vibrate([10,40,10,40,20]);

function creditActive(){const a=state.account;return `<div class="pagehead" style="padding-top:14px"><button class="back" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><h1>Your credit</h1></div>
  <div class="wallet" style="margin-top:4px"><div class="k">${a.waitlist?'On the waitlist · coming soon':'Available to spend'}</div><div class="bal">${money(a.available)}</div><div class="of">of ${money(a.limit)} limit</div><div class="bar"><i style="width:${a.available/a.limit*100}%"></i></div><div class="mc" style="right:18px;bottom:18px">${mcLogo()}</div></div>
  ${schedule(a.limit)}<button class="btn fill" onclick="go('home')">Explore places</button>`;}

/* ---------- BOOKINGS (saved) ---------- */
function renderBookings(){

  if(!list.length){el.innerHTML=`<div class="empty"><div class="em">🤍</div><p>Nothing saved yet.<br>Tap the heart on a place to save it here.</p></div><button class="btn ghost" onclick="go('home')">Browse places</button>`;return;}

/* ---------- PROFILE ---------- */

  const el=document.getElementById('profileContent');const a=state.account;
  const name=a&&a.name?a.name:'Guest';const ini=a&&a.name?name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase():'🐼';const email=a?a.email:'Not signed up yet';

      ${a.spend?`<div class="r"><span class="lab">Monthly spend</span><span class="val">${a.spend}</span></div>`:''}

    ${a?`<div class="wallet"><div class="k">${a.waitlist?'Panda Credit · coming soon':'Panda Credit · available'}</div><div class="bal">${money(a.available)}</div><div class="of">of ${money(a.limit)} limit</div><div class="bar"><i style="width:${a.available/a.limit*100}%"></i></div><div class="mc" style="right:18px;bottom:18px">${mcLogo()}</div></div>`:
      `<div class="creditstrip" style="margin:14px 20px"><div class="k">Panda Credit</div><div class="amt">£300</div><div class="ld">Join the waitlist to unlock your credit.</div><button class="go" onclick="go('credit')">Join now<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`}
    <div class="statcards">
      <div class="statcard s1"><div class="n">🔥 ${state.streak||1}</div><div class="l">Day streak</div></div>
      <div class="statcard s2"><div class="n">${state.points||0}</div><div class="l">Points</div></div>
      <div class="statcard s3"><div class="n">${state.favs.size}</div><div class="l">Saved</div></div>
    </div>
    ${about}
    <div class="menu">
      <div class="mi" onclick="go('bookings')"><span class="ic red"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.9-10-9.3C.4 8.4 2 4.9 5.3 4.5 7.4 4.2 9 5.5 12 8c3-2.5 4.6-3.8 6.7-3.5C22 4.9 23.6 8.4 22 11.7 19.5 16.1 12 21 12 21Z"/></svg></span>Saved places<span class="rt" style="color:var(--muted)">${state.favs.size}</span></div>
      <div class="mi" onclick="go('credit')"><span class="ic green"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>Panda Credit<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></div>
      <div class="mi"><span class="ic blue"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>Live Google data<span class="rt" style="color:${MODE==='live'?'var(--green-deep)':'var(--muted)'}">${MODE==='live'?'On':'Off'}</span></div>
      <div class="mi" onclick="toggleMute()"><span class="ic purple"><svg viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H2v6h4l5 4V5Z"/>${muted?'<path d="M22 9l-6 6M16 9l6 6"/>':'<path d="M16 9a5 5 0 0 1 0 6"/>'}</svg></span>Sound<span class="rt" style="color:${muted?'var(--muted)':'var(--green-deep)'}">${muted?'Off':'On'}</span></div>
      <div class="mi" onclick="toast('Help centre')"><span class="ic amber"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4 2c0 1.5-2 2-2 3.5"/><circle cx="12" cy="17" r=".6" fill="#fff"/></svg></span>Help & support<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>

/* ---------- SHEET / TOAST ---------- */
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML=html;s.classList.add('show');document.getElementById('scrim').classList.add('show');s.scrollTop=0;}
function closeSheet(){document.getElementById('sheet').classList.remove('show');document.getElementById('scrim').classList.remove('show');}
let tT;function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- clock ---------- */
function tick(){const c=document.getElementById('clock');if(!c)return;const n=new Date();c.textContent=`${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;}
setInterval(tick,1000);tick();

/* ---------- engagement engine ---------- */
let audioCtx=null,muted=false;
function sfx(type){
  if(muted)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
    let f=520,dur=.06;if(type==='tab')f=430;if(type==='pop')f=660;if(type==='win'){f=740;dur=.12;}
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);
    if(type==='win'){const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.type='sine';o2.frequency.value=990;g2.gain.setValueAtTime(.0001,t+.1);g2.gain.exponentialRampToValueAtTime(.13,t+.12);g2.gain.exponentialRampToValueAtTime(.0001,t+.26);o2.start(t+.1);o2.stop(t+.28);}
  }catch(e){}
}
function toggleMute(){muted=!muted;safeLS('panda_muted',muted?'1':'0');if(!muted)sfx('pop');renderProfile();}

function dayKey(){return new Date().toISOString().slice(0,10);}
function hashStr(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function renderHome(){
  const hh=document.getElementById('homeHead');if(!hh)return;
  const nm=state.account&&state.account.name?state.account.name.split(' ')[0]:'there';
  hh.innerHTML=`<div class="hello">Welcome back<b>Hi, ${nm} 👋</b></div><div class="streak" onclick="toast('${state.streak||1}-day streak · keep it going!')">🔥 ${state.streak||1} day${(state.streak||1)>1?'s':''}</div>`;
}

/* ---------- persistence + points + gate ---------- */
function saveProfile(){try{localStorage.setItem('panda_profile',JSON.stringify(state.account));}catch(e){}}
function saveFavs(){try{localStorage.setItem('panda_favs',JSON.stringify([...state.favs]));}catch(e){}}
function addPoints(n){state.points=(state.points||0)+n;safeLS('panda_points',String(state.points));}
function loadPersist(){
  try{const p=localStorage.getItem('panda_profile');if(p)state.account=JSON.parse(p);}catch(e){}
  try{const f=localStorage.getItem('panda_favs');if(f)state.favs=new Set(JSON.parse(f));}catch(e){}
  muted=safeLS('panda_muted')==='1';
  state.points=parseInt(safeLS('panda_points')||'0',10)||0;
  const today=dayKey(),last=safeLS('panda_last');let streak=parseInt(safeLS('panda_streak')||'0',10)||0;
  if(last!==today){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);streak=(last===y)?streak+1:1;safeLS('panda_streak',String(streak));safeLS('panda_last',today);addPoints(10);}
  state.streak=streak||1;
  if(!safeLS('panda_first'))safeLS('panda_first',today);
}
function checkGate(){
  const first=safeLS('panda_first');if(!first)return;
  const days=(Date.now()-new Date(first+'T00:00:00').getTime())/864e5;
  const hasProfile=state.account&&state.account.email;
  if(days>=7&&!hasProfile)showGate();
}
function showGate(){let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.className='gate';g.id='gate';g.innerHTML=`<div class="em">🐼</div><h2>Join Panda to keep exploring</h2><p>You've been with Panda for a week! Add your details to unlock offers, credit and everything near you.</p><button onclick="dismissGateToCredit()">Join the waitlist</button>`;document.querySelector('.device').appendChild(g);}g.style.display='flex';}
function dismissGateToCredit(){const g=document.getElementById('gate');if(g)g.style.display='none';go('credit');}

/* ---------- init ---------- */
function hideLoader(){setTimeout(()=>{document.getElementById('loader').classList.add('hide');},900);}
(function boot(){
  apiKey=GOOGLE_API_KEY||safeLS('panda_gkey')||'';
  loadPersist();
  VENUES=demoVenues();MODE='demo';
  renderCats();renderSuggestions();updateFilterPills();renderHome();
  if(apiKey){goLive().finally(()=>{hideLoader();checkGate();});}else{renderLocBanner();hideLoader();checkGate();}
})();
</script>
