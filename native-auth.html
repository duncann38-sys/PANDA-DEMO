<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075b43">
    <title>Sign in to Panda</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 28px 18px; display: grid; place-items: center; background: #dcefe0; color: #10382d; }
      main { width: min(100%, 420px); padding: 30px 24px 24px; border: 1px solid #c6dfce; border-radius: 28px; background: #fffdf6; box-shadow: 0 18px 50px #073d2c22; text-align: center; }
      .brand { display: flex; justify-content: center; align-items: center; gap: 9px; font-size: 26px; font-weight: 900; letter-spacing: -1.8px; }
      .mark { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 12px; background: #075b43; color: white; font-size: 20px; }
      h1 { margin: 25px 0 8px; font-size: 24px; letter-spacing: -.6px; }
      p { margin: 0 auto; max-width: 310px; color: #65776d; font-size: 14px; line-height: 1.5; }
      .providers { display: grid; gap: 11px; margin-top: 25px; }
      button { min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #d7e2d8; border-radius: 15px; background: white; color: #153b30; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
      button.primary { border-color: #075b43; background: #075b43; color: white; }
      button:disabled { cursor: wait; opacity: .65; }
      .g { font-size: 19px; font-weight: 800; color: #4285f4; }
      .a { font-size: 20px; }
      #status { min-height: 22px; margin-top: 18px; color: #567266; font-size: 13px; }
      #status.error { color: #9e3d34; }
      .privacy { margin-top: 15px; color: #819087; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">●</span><span>panda</span></div>
      <h1>Sign in to Panda</h1>
      <p>Choose a provider to securely connect your Panda account. You can return to the app without signing in.</p>
      <div class="providers">
        <button class="primary" type="button" data-provider="Google"><span class="g" aria-hidden="true">G</span> Continue with Google</button>
        <button type="button" data-provider="Apple"><span class="a" aria-hidden="true">●</span> Continue with Apple</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="privacy">Your sign-in is verified by Panda’s secure account service.</div>
    </main>
    <script type="module" src="./native-auth.js"></script>
  </body>
</html>
